name: faceattend
description: "FaceAttend — Face recognition-based employee attendance mobile app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.0+5
  tflite_flutter: ^0.10.0
  path_provider: ^2.1.0
  sqflite: ^2.3.0
  connectivity_plus: ^5.0.0
  shared_preferences: ^2.2.0
  provider: ^6.1.0
  intl: ^0.18.0
  dio: ^5.0.0
  flutter_dotenv: ^5.1.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
